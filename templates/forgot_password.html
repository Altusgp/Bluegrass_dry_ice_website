<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password | Bluegrass Dry Ice</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
<main class="auth-shell">
  <div class="auth-card">
    <div class="eyebrow">Bluegrass Dry Ice</div>
    <h1>Reset your password.</h1>
    <p class="muted">Enter your account email and we'll send you a 6-digit code to reset your password.</p>
    {% if error %}<div class="form-error">{{ error }}</div>{% endif %}
    {% if notice %}<p class="small" style="color:#1b8a4c;font-weight:700">{{ notice }}</p>{% endif %}
    <form class="form-stack" method="post">
      <label>Email<input type="email" name="email" autocomplete="email" required autofocus></label>
      <button class="btn primary block" type="submit">Send reset code</button>
    </form>
    <p class="small" style="margin:16px 0 0;text-align:center"><a href="{{ url_for('login') }}">Back to sign in</a></p>
  </div>
</main>
</body>
</html>
