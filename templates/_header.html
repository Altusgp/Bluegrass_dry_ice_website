<header class="header">
  <div class="wrap nav">
    <a class="brand" href="{{ url_for('home') }}">
      <div class="flake">❄</div>
      <span><b>Bluegrass Dry Ice</b><small>Nicholasville · Lexington</small></span>
    </a>
    <nav class="navlinks">
      <a href="{{ url_for('home') }}#pricing">Pricing</a>
      <a href="{{ url_for('home') }}#estimator">How Much?</a>
      <a href="{{ url_for('home') }}#order">Order</a>
      <a href="{{ url_for('home') }}#pickup">Pickup</a>
      <a href="{{ url_for('home') }}#guides">Guides</a>
      <a href="{{ url_for('home') }}#contact">Contact</a>
    </nav>
    {% if current_user and current_user['is_admin'] %}
    <a class="btn ghost small" href="{{ url_for('admin_dashboard') }}">Admin</a>
    {% endif %}
    <a class="icon-btn" href="{{ url_for('account') if current_user else url_for('login') }}"
       aria-label="{{ 'My account' if current_user else 'Sign in' }}" title="{{ 'My account' if current_user else 'Sign in' }}">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"></path>
      </svg>
    </a>
    <a class="btn primary small" href="{{ url_for('home') }}#order">Order Now</a>
  </div>
</header>
